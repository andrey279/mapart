name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach packages to
        required: true
        type: string
        default: v0.1.0
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Install desktop development libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb
      - run: go vet -tags gui ./...
      - run: xvfb-run -a go test -tags gui ./...
  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mapart-*
          merge-multiple: true
          path: packages
      - name: Checksums
        working-directory: packages
        run: sha256sum ./*.zip > SHA256SUMS.txt
      - name: Attach packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(packages/*.zip)
          if [[ ${#archives[@]} -ne 6 ]]; then
            echo "Expected 6 platform packages, found ${#archives[@]}" >&2
            exit 1
          fi
          test -s packages/SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${archives[@]}" packages/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" packages/SHA256SUMS.txt --verify-tag --draft --generate-notes
          fi
